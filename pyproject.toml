[project]
name = "ea-validator"
version = "1.0.0"
description = "Backtesting and validation workbench for MetaTrader 5 Expert Advisor developers"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "hmmlearn>=0.3",
    "riskfolio-lib>=6.0",
    "scipy>=1.13",
    "arch>=7.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pyarrow>=24.0.0",
    "seaborn>=0.13.2",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas-stubs",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
